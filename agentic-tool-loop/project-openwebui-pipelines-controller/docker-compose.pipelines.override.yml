services:
  pipelines:
    volumes:
      - ./pipelines:/app/pipelines
    environment:
      - OPENWEBUI_BASE_URL=http://open-webui:8080
      - OPENWEBUI_API_KEY=${OPENWEBUI_API_KEY:-}
      - VULKAN_BRIDGE_URL=http://host.docker.internal:3571/vulkan_helper
    extra_hosts:
      - "host.docker.internal:host-gateway"
