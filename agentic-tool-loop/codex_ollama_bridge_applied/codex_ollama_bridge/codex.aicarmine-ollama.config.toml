# AI-Carmine Codex + Ollama local bridge configuration.
# Merge this into:  %USERPROFILE%\.codex\config.toml
# or use it as a profile after adapting paths.

model_provider = "aicarmine_ollama_bridge"
model = "qwen3-coder:30b"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

# Adjust these to the real Ollama model context.
# For Ollama, context size must be set in the model/Modelfile, not via the OpenAI API.
model_context_window = 32768
model_auto_compact_token_limit = 24576
tool_output_token_limit = 12000
model_reasoning_summary = "none"
model_supports_reasoning_summaries = false

[model_providers.aicarmine_ollama_bridge]
name = "AI-Carmine Ollama Bridge"
base_url = "http://127.0.0.1:3581/v1"
wire_api = "responses"
request_max_retries = 1
stream_max_retries = 1
stream_idle_timeout_ms = 600000

# Alternative direct provider, if you do not need the 3581 state/proxy layer:
# [model_providers.aicarmine_ollama_direct]
# name = "Ollama Direct"
# base_url = "http://127.0.0.1:11434/v1"
# wire_api = "responses"

[mcp_servers.aicarmine_tools]
command = "python"
args = ["C:\\Users\\carmi\\AI\\services\\aicarmine_codex_mcp_server.py"]
env = { AICARMINE_VULKAN_AGENT_URL = "http://127.0.0.1:3572/vulkan/agent", AICARMINE_BROKER_BASE_URL = "http://127.0.0.1:3572", AICARMINE_LAB_REPO = "C:\\Users\\carmi\\AI\\lab-worktrees\\blender-audio-project-lab", AICARMINE_REAL_REPO = "C:\\Users\\carmi\\ProjectsDir\\blender-audio-project", AICARMINE_USEFUL_TOOLS_ROOT = "C:\\Users\\carmi\\AI\\services\\useful_tools", AICARMINE_MCP_TOOL_TIMEOUT_SECONDS = "900" }
startup_timeout_sec = 20
tool_timeout_sec = 900
enabled = true

# Keep destructive actions under explicit approval.
[mcp_servers.aicarmine_tools.tools.aicarmine_repo_apply_patch]
approval_mode = "prompt"

[mcp_servers.aicarmine_tools.tools.aicarmine_repo_write_file]
approval_mode = "prompt"

[mcp_servers.aicarmine_tools.tools.aicarmine_repo_command]
approval_mode = "prompt"

[mcp_servers.aicarmine_tools.tools.aicarmine_repo_validate]
approval_mode = "prompt"
