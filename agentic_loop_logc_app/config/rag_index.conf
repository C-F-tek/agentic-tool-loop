# RAG Index Configuration
# Parameters for building and maintaining the RAG index

[general]
# Source type: git or filesystem
source = filesystem

# Index mode: delta (incremental) or full (complete rebuild)
mode = delta

# File suffixes to include (comma-separated)
suffixes = .py,.md,.yaml,.yml,.json,.csv,.sql,.txt

# Maximum file size in bytes
max_file_bytes = 2000000

# Chunk size in lines
chunk_lines = 180

# Chunk size in characters
chunk_chars = 4000

[reranker]
# Enable reranking
enabled = true

# Reranker model name
model = BAAI/bge-reranker-v2-m3

# Reranker URL
url = http://127.0.0.1:3550/v3/rerank

# Candidate limit before reranking
candidate_limit = 80

# Top-K results after reranking
top_k = 12

# Maximum total output characters
max_total_chars = 50000

# Reranker timeout in seconds
timeout_seconds = 30