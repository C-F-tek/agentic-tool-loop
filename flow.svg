  <a href="services/vulkan_bridge/flow.svg"><rect class="box" x="538" y="934" width="210" height="30" rx="8"/><text class="small" x="552" y="954">3571 bridge</text></a>
  <a href="services/launch/flow.svg"><rect class="box" x="776" y="934" width="210" height="30" rx="8"/><text class="small" x="790" y="954">launch</text></a>
  <a href="services/codex_bridge/flow.svg"><rect class="box" x="1014" y="934" width="210" height="30" rx="8"/><text class="small" x="1028" y="954">codex bridge</text></a>
  
  <a href="services/model_export/flow.svg"><rect class="box" x="62" y="974" width="210" height="30" rx="8"/><text class="small" x="76" y="994">model export</text></a>
  <a href="codex_ollama_bridge_applied/flow.svg"><rect class="box" x="300" y="974" width="210" height="30" rx="8"/><text class="small" x="314" y="994">applied bridge</text></a>
  <a href="codex_ollama_bridge_applied/useful_tools/flow.svg"><rect class="box" x="538" y="974" width="210" height="30" rx="8"/><text class="small" x="552" y="994">useful tools</text></a>
  <a href="codex_ollama_bridge_applied/useful_tools/context/flow.svg"><rect class="box" x="776" y="974" width="210" height="30" rx="8"/><text class="small" x="790" y="994">context</text></a>
  <a href="codex_ollama_bridge_applied/useful_tools/memory/flow.svg"><rect class="box" x="1014" y="974" width="210" height="30" rx="8"/><text class="small" x="1028" y="994">memory</text></a>

  <!-- Documentation links -->
  <a href="services/MCP_TOOL_INDEX.md"><rect class="boxBlue" x="62" y="1014" width="210" height="30" rx="8"/><text class="small" x="76" y="1034">MCP Tool Index</text></a>
  <a href="services/SKILLS_INDEX.md"><rect class="boxGreen" x="300" y="1014" width="210" height="30" rx="8"/><text class="small" x="314" y="1034">Skills Index</text></a>
  <a href="services/END_TO_END_AGENTIC_FLOW.md"><rect class="boxOrange" x="538" y="1014" width="210" height="30" rx="8"/><text class="small" x="552" y="1034">End-to-End Flow</text></a>
  <a href="README.md"><rect class="boxGray" x="776" y="1014" width="210" height="30" rx="8"/><text class="small" x="790" y="1034">README</text></a>

  <text class="subtitle" x="40" y="1080">Test-backed invariants: filesystem survives SQLite failure; 3571 OpenAPI exposes only /vulkan_helper; command tools classify consent; final_path rehydration does not leak local paths; MCP tool surface is authoritative.</text>
</svg>